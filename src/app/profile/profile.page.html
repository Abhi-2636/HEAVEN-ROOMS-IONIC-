<ion-header class="ion-no-border">
  <ion-toolbar class="app-header">
    <div class="header-logo-container">
      <img src="https://i.postimg.cc/Qt51j6tw/Whats-App-Image-2025-10-11-at-16-48-26-removebg-preview.png" alt="Heaven Rooms Logo" class="header-logo" />
      <ion-title>Heaven Rooms</ion-title>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="profile-card-section">
    <div class="profile-info-card">
      <ion-avatar class="profile-avatar">
        <img [src]="user?.photo ? user?.photo : 'https://ionicframework.com/docs/img/demos/avatar.svg'" />
      </ion-avatar>
      <div class="user-details">
        <h2>{{ user?.name }}</h2>
        <p class="email">{{ user?.email }}</p>
        <p class="bio">{{ user?.bio }}</p>
        <ion-button expand="block" fill="clear" color="primary" (click)="onEditProfile()">
          <ion-icon slot="start" name="create-outline"></ion-icon>
          Edit Profile
        </ion-button>
      </div>
    </div>
  </div>

  <div class="action-sections">
    <ion-list class="settings-list">
      <ion-list-header>
        <ion-label>Settings</ion-label>
      </ion-list-header>

      <ion-item button="true" detail="true" (click)="onEditProfile()">
        <ion-icon slot="start" name="person-circle-outline"></ion-icon>
        <ion-label>Personal Information</ion-label>
      </ion-item>

      <ion-item button="true" detail="true" routerLink="/tabs/bookings">
        <ion-icon slot="start" name="bookmark-outline"></ion-icon>
        <ion-label>My Bookings</ion-label>
      </ion-item>

      <ion-item button="true" detail="true" routerLink="/tabs/favourite">
        <ion-icon slot="start" name="heart-outline"></ion-icon>
        <ion-label>My Favorites</ion-label>
      </ion-item>

      <ion-item button="true" detail="true" (click)="onHelpSupport()">
        <ion-icon slot="start" name="help-buoy-outline"></ion-icon>
        <ion-label>Help & Support</ion-label>
      </ion-item>
    </ion-list>
  </div>

  <div class="logout-section ion-padding">
    <ion-button expand="block" color="dark" (click)="logout()">
      <ion-icon slot="start" name="log-out-outline"></ion-icon>
      Logout
    </ion-button>
  </div>
</ion-content>
